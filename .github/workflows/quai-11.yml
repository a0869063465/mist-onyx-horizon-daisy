name: quai-11

on:
  workflow_dispatch:
  push:
    branches: [quai-moi]
    paths:
      - .github/workflows/quai-11.yml

permissions:
  contents: write

concurrency:
  group: quai-11
  cancel-in-progress: false

jobs:
  add:
    if: github.ref == 'refs/heads/quai-moi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quai-moi

      - name: Add 11 cards
        run: |
          set -euo pipefail
          if grep -q '"id": "rong-dia-nguc"' src/lib/catalog.ts; then
            echo "already applied"
            exit 0
          fi
          curl -fsSL --retry 5 --retry-delay 2 -o /tmp/code.patch https://paste.rs/gTDzM
          echo "2a5d705c561f22cd227803419e6f858d3ad3a834a970ed7a5a93d13e1774e651  /tmp/code.patch" | sha256sum -c -
          git apply /tmp/code.patch
          mkdir -p public/art
          fetch() {
            local url="$1" dest="$2" sum="$3"
            curl -fsSL --retry 5 --retry-delay 2 -o "$dest" "$url"
            echo "$sum  $dest" | sha256sum -c -
          }
          fetch https://paste.rs/GSBUd public/art/rong-dia-nguc.jpg b217a4565c220f406db1ca36bdd095565503477120642b73674631bb9c2d3898
          fetch https://paste.rs/RcC3R public/art/hu-nhot.jpg 453edc68084282cff7b643641f70d2b3f192d9134660465204dce6394416ba1d
          fetch https://paste.rs/T0Hvk public/art/sangan.jpg d49f1b04d7a0e2524992d6f8f1f4c0c775c908f4eafd862b1fa25ab02bd051b6
          fetch https://paste.rs/CEAxf public/art/thanh-thuat-su.jpg 22ef3940c517763ca6872608a9db12026eb2e7f5c6f01f531d7a8df6b48799c2
          fetch https://paste.rs/VU8uz public/art/ke-trom-ao-trang.jpg dd6842c5a7127da63188828dd1bae693d723ff1397868735767796ff5a87d87a
          fetch https://paste.rs/mOBAJ public/art/binh-bien-hinh.jpg bcaebcabe151dad1cfc6dec0409ba477f74fd5807781366b030e2eac8ecbb54d
          fetch https://paste.rs/xgBbm public/art/ky-nhong-dien.jpg 269a93ed538840ffbbdd0060ebcf1a641f4fe4cc0cc3be7484e74d151a2f1c64
          fetch https://paste.rs/qs2np public/art/ky-si-canh-cut.jpg f351a472500ce6e9a28129ea7612dbbc71c7889a829a5903ff723da871960d25
          fetch https://paste.rs/eIq5c public/art/mat-na-bong-toi.jpg be217533829747428724f15ee39de4a09d02b3869340a426f7a3c9f176a6ccb8
          fetch https://paste.rs/19Zns public/art/khung-long-hinh-nguoi.jpg 315371ee24edf93276e305c6fe97792b8ac1435972cea47beb7d7013f4a0f17d
          fetch https://paste.rs/qiLTa /tmp/ny0.bin 4bf70f25d179c0f77cf3f7e47e6d6bd3aa97389d993f9b8cd442afc58d41d771
          fetch https://paste.rs/x6Gzx /tmp/ny1.bin b7fdc2581ee107ec3f42ebbb7f72a5c11a52daed9f89f0600347f5a032d7d4e0
          cat /tmp/ny0.bin /tmp/ny1.bin > public/art/nguoi-yeu-hanh-phuc.jpg
          echo "7f5de9ba7e25cc4ba73a747b1266745d606cd41255a4e5ebb153c903c8c01a3f  public/art/nguoi-yeu-hanh-phuc.jpg" | sha256sum -c -
          git config user.name "a0869063465"
          git config user.email "342921535+a0869063465@users.noreply.github.com"
          git add \
            src/lib/card-edits.ts \
            src/lib/catalog.ts \
            src/lib/duel.ts \
            src/lib/field-chips.ts \
            src/lib/skill-book.ts \
            src/routes/play.tsx \
            public/art/rong-dia-nguc.jpg \
            public/art/hu-nhot.jpg \
            public/art/sangan.jpg \
            public/art/thanh-thuat-su.jpg \
            public/art/ke-trom-ao-trang.jpg \
            public/art/binh-bien-hinh.jpg \
            public/art/ky-nhong-dien.jpg \
            public/art/ky-si-canh-cut.jpg \
            public/art/mat-na-bong-toi.jpg \
            public/art/khung-long-hinh-nguoi.jpg \
            public/art/nguoi-yeu-hanh-phuc.jpg
          git rm -f .github/workflows/quai-11.yml
          git commit -m "Thêm 11 quái mới"
          git push origin HEAD:quai-moi
