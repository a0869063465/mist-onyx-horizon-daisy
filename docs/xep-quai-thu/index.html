<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xếp quái thú</title>
<style>
  :root { --bg:#0b1020; --card:#141b33; --line:#2a3560; --gold:#ffd77a; --ink:#e9eefc; --mute:#8b97c2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:radial-gradient(120% 60% at 50% 0%, #1a2550, var(--bg)); color:var(--ink); font:14px/1.35 system-ui, sans-serif; padding-bottom:70px; }
  header { padding:14px 62px 6px 14px; position:relative; }
  h1 { margin:0 0 4px; font-size:19px; color:var(--gold); }
  header p { margin:0; color:#a9b6dc; font-size:13px; }
  #copy { position:absolute; right:12px; top:12px; width:42px; height:42px; border-radius:12px; border:1px solid var(--gold); background:#3a2d0c; color:var(--gold); display:flex; align-items:center; justify-content:center; padding:0; }
  #copy:active { transform:scale(.92); }
  .sets { display:flex; gap:8px; margin:6px 12px 8px; flex-wrap:wrap; }

  .sets button.on { border-color:#3f8cff; color:#9fd0ff; background:#10284f; }
  .tabs { position:sticky; top:0; z-index:5; display:flex; gap:8px; padding:8px 12px; background:rgba(11,16,32,.95); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); overflow-x:auto; }
  .tabs button { flex:0 0 auto; min-width:104px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#0d1430; color:#cfd8f5; font-weight:700; font-size:14px; }
  .tabs button small { display:block; font-weight:400; font-size:11px; color:var(--mute); margin-top:1px; }
  .tabs button.on { border-color:var(--gold); color:var(--gold); background:#3a2d0c; }
  .tabs button.on small { color:#d8b86a; }
  .tabs button.plus { min-width:54px; font-size:22px; border-style:dashed; border-color:var(--gold); color:var(--gold); }
  .box { margin:12px; border-radius:14px; padding:10px; }
  .box h2 { margin:0 0 8px; font-size:14px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .box h2 b { font-size:18px; }
  .box h2 .r { display:flex; align-items:center; gap:10px; }
  .box h2 button { border:1px solid var(--line); background:var(--card); color:#cfd8f5; border-radius:8px; padding:4px 10px; font-size:12px; }
  .pool { border:1px dashed var(--line); background:rgba(13,20,48,.7); }
  .pool h2 { color:#cfd8f5; } .pool h2 b { color:var(--gold); }
  .done { border:1px solid var(--gold); background:linear-gradient(180deg,#221c3a,#151a33); }
  .done h2 { color:var(--gold); } .done h2 b { color:var(--gold); }
  .grid { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:7px; }
  .grid button { padding:0; border:2px solid var(--line); border-radius:6px; overflow:hidden; background:#0d1430; touch-action:manipulation; }
  .grid button:active { transform:scale(.94); }
  .grid img { display:block; width:100%; aspect-ratio:202/312; object-fit:cover; }
  body.view .grid button { border-color:#3f8cff; }
  .grid button { position:relative; }
  .grid .mn { position:absolute; left:3px; top:3px; min-width:20px; height:20px; border-radius:50%; background:#1d3a8a; color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; border:1px solid #e0c070; }
  .none { color:var(--mute); font-size:12px; padding:6px 2px; grid-column:1/-1; }
  .sub { color:var(--mute); font-size:12px; margin-top:8px; min-height:5.4em; }
  footer { position:fixed; left:0; right:0; bottom:0; z-index:6; padding:10px 12px; background:rgba(11,16,32,.96); border-top:1px solid var(--line); display:flex; gap:8px; }
  footer button { flex:1; padding:12px; border-radius:10px; border:1px solid var(--gold); background:#3a2d0c; color:var(--gold); font-weight:700; font-size:14px; }
  footer button.mode { flex:0 0 auto; min-width:120px; border-color:#3f8cff; background:#10284f; color:#9fd0ff; }
  #out { display:none; margin:12px; padding:10px; background:#0d1430; border:1px solid var(--line); border-radius:10px; white-space:pre-wrap; font-size:12px; user-select:text; }
  #pop { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(5,8,20,.85); z-index:20; padding:16px; }
  #pop .b { width:100%; max-width:340px; text-align:center; }
  #pop h2 { margin:10px 0 2px; font-size:17px; color:var(--gold); }
  #pop .c { color:var(--mute); font-size:12px; }
  #pop .b { max-height:92vh; overflow:auto; }
  #pop .card { display:flex; gap:12px; text-align:left; background:var(--card); border:1px solid var(--gold); border-radius:14px; padding:12px; }
  #pop .card img { width:96px; flex:0 0 96px; align-self:flex-start; border-radius:8px; border:1px solid var(--line); }
  #pop .card h2 { margin:0 0 4px; font-size:17px; color:var(--gold); }
  #pop .card .meta { color:#9fd0ff; font-size:13px; margin-bottom:6px; }
  #pop .card .tg { display:inline-block; background:#3a2d0c; color:var(--gold); border:1px solid var(--gold); border-radius:6px; padding:1px 7px; font-size:12px; margin-bottom:6px; }
  #pop .card p { margin:0 0 6px; font-size:14px; line-height:1.45; color:#e9eefc; }
  #pop .card p.up { color:#ffd77a; }
  .sheet { position:fixed; inset:0; display:none; align-items:flex-end; justify-content:center; background:rgba(5,8,20,.8); z-index:30; }
  .sheet .panel { width:100%; max-width:560px; background:var(--card); border:1px solid var(--gold); border-radius:16px 16px 0 0; padding:14px; }
  .sheet h3 { margin:0 0 4px; color:var(--gold); font-size:16px; }
  .sheet input { width:100%; padding:11px; border-radius:10px; border:1px solid var(--line); background:#0d1430; color:var(--ink); font-size:15px; margin-top:8px; }
  .acts { display:flex; gap:8px; margin-top:14px; }
  .acts button { flex:1; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:#cfd8f5; font-weight:700; font-size:14px; }
  .acts button.ok { border-color:var(--gold); background:#3a2d0c; color:var(--gold); }
  .acts button.del { border-color:#ff5a5a; background:#4a1414; color:#ffb0b0; }
  .nav { margin:0 0 10px; padding:0 0 8px; border-bottom:1px solid var(--line); }
  .crumbs { display:flex; flex-wrap:wrap; align-items:center; gap:4px; font-size:13px; }
  .crumbs button { border:0; background:none; color:#9fd0ff; padding:2px 4px; font-size:13px; font-weight:700; }
  .crumbs button.cur { color:var(--gold); }
  .crumbs i { color:var(--mute); font-style:normal; }
  .kids { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .kids button { border:1px solid var(--line); background:var(--card); color:#cfd8f5; padding:6px 11px; border-radius:999px; font-size:12px; font-weight:700; }
  .kids button small { color:var(--mute); margin-left:4px; font-weight:400; }
  .kids .lbl { color:var(--mute); font-size:12px; align-self:center; }
  .sheet .rowb { display:flex; gap:8px; margin-top:14px; }
  .sheet .rowb button { flex:1; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:#cfd8f5; font-weight:700; font-size:14px; }
  .sheet .rowb button.ok { border-color:var(--gold); background:#3a2d0c; color:var(--gold); }
  .sheet .rowb button.del { border-color:#ff5a5a; background:#4a1414; color:#ffb0b0; }
  .sheet .note { color:var(--mute); font-size:12px; margin-top:6px; }
  footer button.dir { height:48px; overflow:hidden; flex:0 0 54px; padding:0; font-size:26px; line-height:1; border-color:#3f8cff; background:#10284f; color:#9fd0ff; }
  footer button.dir:active { transform:scale(.92); }
  footer button:disabled { opacity:.4; }
  .nav .tabs2 { display:flex; gap:8px; overflow-x:auto; }
  .nav .tabs2 button { flex:0 0 auto; min-width:92px; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:#0d1430; color:#cfd8f5; font-weight:700; font-size:13px; }
  .nav .tabs2 button small { display:block; font-weight:400; font-size:11px; color:var(--mute); margin-top:1px; }
  .nav .tabs2 button.plus { min-width:48px; font-size:22px; border-style:dashed; border-color:var(--gold); color:var(--gold); }
  .nav .tabs2 button.on { border-color:var(--gold); color:var(--gold); background:#3a2d0c; }
  .nav .tabs2 button.on small { color:#d8b86a; }
  .nav .tabs2 + .tabs2 { margin-top:8px; }
  .nav .tabs2 button.back { min-width:44px; padding:9px 10px; border-color:#3f8cff; color:#9fd0ff; }
  .srch { padding:8px 12px 0; }
  .srch input { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:#0d1430; color:#e8ecfb; font-size:15px; }
  .srch .res { margin-top:6px; display:flex; flex-direction:column; gap:6px; }
  .srch .res button { text-align:left; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:#0d1430; color:#cfd8f5; font-size:14px; }
  .srch .res button b { color:var(--gold); }
  .srch .res button small { display:block; color:var(--mute); font-size:11px; margin-top:1px; }
  .srch .res .none { color:var(--mute); font-size:13px; padding:4px 2px; }
  #tabs.arr { position:static; display:block; padding:8px 12px; overflow:visible; }
  #tabs.nrm { display:block; padding:6px 0 4px; }
  .trow { display:flex; gap:8px; padding:2px 12px 6px; overflow-x:auto; }
  .trow button { flex:0 0 auto; min-width:96px; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:#0d1430; color:#cfd8f5; font-weight:700; font-size:14px; }
  .trow button small { display:block; font-weight:400; font-size:11px; color:var(--mute); }
  .trow button.on { border-color:var(--gold); color:var(--gold); background:#3a2d0c; }
  .trow button.plus { min-width:54px; font-size:20px; border-style:dashed; border-color:var(--gold); color:var(--gold); }
  .trow.gr button { background:#101a3a; }
  .trow.gr button.on { border-color:#7fd6ff; color:#7fd6ff; background:#0f2a44; }
  .nrm .top2 { display:flex; gap:8px; padding:0 12px 6px; }
  .nrm .top2 button { padding:6px 10px; border-radius:10px; border:1px solid var(--line); background:#0d1430; color:#cfd8f5; font-size:13px; font-weight:700; }
  .gh { display:flex; align-items:center; gap:8px; margin:2px 0 8px; }
  .gh b { flex:1; color:var(--gold); font-size:14px; }
  .gh button { padding:7px 10px; border-radius:10px; border:1px solid var(--line); background:#0d1430; color:#cfd8f5; font-size:13px; font-weight:700; }
  .gh button.on { border-color:var(--gold); color:var(--gold); background:#3a2d0c; }
  .gbox { border:1px solid var(--line); border-radius:12px; padding:8px; margin-bottom:8px; background:#0a1126; }
  .gbox.cur { border-color:#7a6320; }
  .gbox.drop { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
  .gbox .gt { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:13px; color:#d8b86a; font-weight:700; }
  .gbox .gt span { flex:1; }
  .gbox .gt button { padding:5px 9px; border-radius:8px; border:1px solid var(--gold); background:#3a2d0c; color:var(--gold); font-size:12px; font-weight:700; }
  .gbox .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .gbox .chips button { flex:0 0 auto; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:#0d1430; color:#cfd8f5; font-weight:700; font-size:13px; }
  .gbox .chips button small { display:block; font-weight:400; font-size:11px; color:var(--mute); }
  .gbox .chips button.on { border-color:var(--gold); color:var(--gold); background:#3a2d0c; }
  .gbox .chips button.pk { border-color:#46e874; color:#46e874; }
  .gbox .chips button.plus { border-style:dashed; border-color:var(--gold); color:var(--gold); font-size:18px; padding:6px 14px; }
  .gbox .none { color:var(--mute); font-size:12px; }
  footer button.dir.starred { border-color:var(--gold); background:#3a2d0c; color:var(--gold); }
  .grid .bk { display:block; padding:3px 4px; background:#3a2d0c; color:var(--gold); font-size:10px; font-weight:700; line-height:1.15; text-align:center; white-space:normal; overflow-wrap:anywhere; border-top:1px solid #7a6320; }
  .tsheet { position:fixed; inset:0; display:none; background:rgba(5,8,20,.35); z-index:31; }
  .tsheet .panel { position:absolute; width:min(344px, calc(100vw - 16px)); max-height:80vh; overflow:auto; background:var(--card); border:1px solid var(--gold); border-radius:14px; padding:12px; box-shadow:0 8px 28px rgba(0,0,0,.55); }
  .tsheet h3 { margin:0 0 2px; color:var(--gold); font-size:15px; }
  .tsheet .note { color:var(--mute); font-size:12px; margin-bottom:6px; }
  .tsheet .bg { margin:8px 0 6px; color:#7fd6ff; font-size:12px; font-weight:700; }
  .tsheet .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .tsheet .kw { flex:0 0 auto; padding:8px 11px; border-radius:10px; border:1px solid var(--line); background:#0d1430; color:#cfd8f5; font-size:13px; font-weight:700; }
  .tsheet .kw.plus { border-style:dashed; border-color:var(--gold); color:var(--gold); font-size:18px; padding:5px 16px; }
  .tsheet .kw.ok { border-color:var(--gold); background:#3a2d0c; color:var(--gold); }
  .tsheet .kwin { flex:1 1 150px; min-width:0; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:#0d1430; color:var(--ink); font-size:14px; }
  .tsheet .kw.on { border-color:var(--gold); color:var(--gold); background:#3a2d0c; }
  .grid > * { content-visibility:auto; contain-intrinsic-size:auto 190px; }
  .grid .bk.ck { background:#3b1420; color:#ffb0b8; }
  .tsheet h3.kt { display:flex; gap:14px; align-items:baseline; margin:0 0 2px; }
  .tsheet h3.kt button { background:none; border:0; padding:2px 0; font:inherit; font-size:15px; font-weight:700; color:var(--mute); border-bottom:2px solid transparent; }
  .tsheet h3.kt button.on { color:var(--gold); border-bottom-color:var(--gold); }
  .tsheet h3.kt button.on[data-pk="cond"] { color:#ffb0b8; border-bottom-color:#ff8a98; }
  .grid .nm { display:block; padding:3px 4px; background:#0b1020; color:#e9eefc; font-size:10px; font-weight:700; line-height:1.15; text-align:center; white-space:normal; overflow-wrap:anywhere; }
  .pairbox { grid-column: span 2; display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; border:2px solid var(--gold); border-radius:10px; background:#1b2547; }
  .pairbox button { min-width:0; }
  .grid button.pk { outline:3px solid #7fd6ff; outline-offset:-3px; box-shadow:0 0 10px #7fd6ff; }
  /* Ô lá cao cố định theo tỉ lệ ảnh, nhãn nằm đè lên đáy ảnh: chiều cao không đổi khi ảnh tải xong nên trang không nhảy. */
  .grid > button, .pairbox > button { position:relative; display:block; aspect-ratio:150/214; }
  .grid img { height:100%; aspect-ratio:auto; object-fit:cover; }
  .grid .lbl { position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; }
</style>
</head>
<body>
<header>
  <button id="copy" aria-label="Sao chép kết quả" title="Sao chép kết quả"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>
  <h1>Xếp quái thú</h1>
  <p id="hint"></p>
</header>
<div class="sets" id="sets"></div>
<div class="srch"><input id="sq" type="search" placeholder="Tìm tên nhóm…" autocomplete="off"><div class="res" id="sres"></div></div>
<div class="tabs" id="tabs"></div>
<section class="box pool"><h2><span id="pt">Chưa sắp xếp</span><b id="np">0</b></h2><div class="grid" id="pool"></div></section>
<section class="box done"><h2><span id="dn">Đã xếp</span><span class="r"><button id="edit">Sửa nhóm</button><b id="nd">0</b></span></h2><div class="nav" id="nav"></div><div class="grid" id="done"></div><div class="sub" id="dsub"></div></section>
<pre id="out"></pre>
<div id="impbox" style="display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.8);padding:16px"><div style="background:#0b1020;border:1px solid var(--gold);border-radius:12px;padding:12px;height:100%;display:flex;flex-direction:column;gap:8px"><b style="color:var(--gold)">Dán chữ đã sao chép vào đây</b><textarea id="imptx" style="flex:1;background:#111a33;color:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px"></textarea><div id="impmsg" style="font-size:13px"></div><div style="display:flex;gap:8px"><button id="impok" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--gold);background:#3a2d0c;color:var(--gold);font-weight:700">Nạp</button><button id="impno" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:#111a33;color:#fff">Đóng</button></div></div></div>
<div id="pop"><div class="b" id="pb"></div></div>
<div class="tsheet" id="tsheet"><div class="panel" id="tpanel"></div></div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<footer><button class="mode" id="mode">Xem</button><button id="top">↑ Trở về</button><button id="dir" class="dir" aria-label="Hướng chuyển lá: lên nhóm mẹ">↑</button></footer>
<script>
const KEY = "qt-groups-v1";
const COPYSVG = document.getElementById("copy").innerHTML, OKSVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
let granSel = null, arrange = false, picks = new Set(), bonusOn = false;
let D = null, setId = null, curId = null, mode = "sort", ST = {}, dir = "up", lastKid = {};
try { { const v = localStorage.getItem("qt-dir"); dir = v === "down" ? "down" : v === "star" ? "star" : v === "pair" ? "pair" : "up"; } } catch (e) {}
try { ST = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
const $ = (id) => document.getElementById(id);
/* Ảnh lá s1-113..237 nằm gộp trong một ảnh ghép (atlas/b1.webp, 10 cột, ô 150×214) vì mỗi bản đăng chỉ chứa tối đa 511 tệp; cắt ra bằng canvas khi mở trang. */
const ATLAS = { file: "atlas/b1.webp", first: 113, last: 237, cols: 10, w: 150, h: 214 };
const IMGS = {};
const cardSrc = (id) => IMGS[id] || "cards/" + id + ".webp";
async function loadAtlas() {
  try {
    const bm = await createImageBitmap(await (await fetch(ATLAS.file)).blob());
    const cv = document.createElement("canvas"); cv.width = ATLAS.w; cv.height = ATLAS.h; const cx = cv.getContext("2d");
    for (let n = ATLAS.first; n <= ATLAS.last; n++) {
      const i = n - ATLAS.first;
      cx.clearRect(0, 0, ATLAS.w, ATLAS.h);
      cx.drawImage(bm, (i % ATLAS.cols) * ATLAS.w, Math.floor(i / ATLAS.cols) * ATLAS.h, ATLAS.w, ATLAS.h, 0, 0, ATLAS.w, ATLAS.h);
      const b = await new Promise((r) => cv.toBlob(r, "image/webp", 0.92));
      if (b) IMGS["s1-" + String(n).padStart(3, "0")] = URL.createObjectURL(b);
    }
  } catch (e) {}
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} pushRemote(); };
/* Đồng bộ qua cơ sở dữ liệu chung: mỗi bộ lá là một tài liệu state/<id>, chỉ ghi sau khi đã đọc xong bản trên máy chủ để không đè bằng bản trống. */
let REM = null; const remoteOK = {}, lastJson = {}; let pushTimer = null, remRender = 0;
function pushRemote() {
  if (!REM) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    for (const id of Object.keys(remoteOK)) {
      if (!ST[id]) continue;
      const j = JSON.stringify(ST[id]);
      if (j === lastJson[id]) continue;
      lastJson[id] = j;
      REM.collection("state").doc(id).set({ json: j, at: Date.now() }).catch(() => { lastJson[id] = null; });
    }
  }, 600);
}
async function loadRemote() {
  try {
    const cl = window.claude && window.claude.use ? await Promise.race([window.claude.use("db"), new Promise((r) => setTimeout(() => r(null), 4000))]) : null;
    if (!cl) return;
    for (const set of D.sets) {
      const ref = cl.collection("state").doc(set.id);
      const snap = await Promise.race([ref.get(), new Promise((_, rj) => setTimeout(() => rj(new Error("t")), 4000))]);
      if (snap.exists && snap.data() && snap.data().json) { ST[set.id] = JSON.parse(snap.data().json); lastJson[set.id] = snap.data().json; try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }
